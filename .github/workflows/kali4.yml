name: Kali Linux Full (RDP + Direct Termux SSH)

on:
  workflow_dispatch:
    inputs:
      ssh_public_key:
        description: 'Termux SSH Public Key paste cheyandi (cat ~/.ssh/id_ed25519.pub)'
        required: false
        type: string
      install_large_tools:
        description: 'Install full Kali large tools (true = full tools, false = default fast setup)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  kali-linux-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free Up Disk Space for Kali Full
        run: |
          echo "Cleaning runner disk space for full Kali Linux installation..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - name: Install and Connect Tailscale
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if [ -n "$TS_AUTH_KEY" ]; then
            curl -fsSL https://tailscale.com/install.sh | sh
            sudo tailscale up --authkey="$TS_AUTH_KEY" --hostname="kali-runner-${GITHUB_RUN_ID}"
            
            TS_IP=""
            for i in {1..12}; do
              TS_IP=$(tailscale ip -4 || true)
              if [ -n "$TS_IP" ]; then
                break
              fi
              sleep 5
            done
            
            if [ -n "$TS_IP" ]; then
              echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
              echo "Tailscale Connected! IP: $TS_IP"
            else
              echo "Warning: Tailscale IP raledu, tmate SSH backup use avtundi."
            fi
          else
            echo "TAILSCALE_AUTH_KEY secret ledu, tmate SSH direct link generate avtundi."
          fi

      - name: Prepare Host Ports for Direct Kali SSH & RDP
        run: |
          # Host SSH port 22 stop chestunnam so Termux direct ga Kali container ki connect avtundi
          sudo systemctl stop ssh.service ssh.socket || true
          sudo systemctl disable ssh.service ssh.socket || true

      - name: Launch Privileged Kali Linux Container
        run: |
          docker pull kalilinux/kali-rolling:latest
          docker run -d \
            --name kali \
            --hostname kali-cloud \
            --network host \
            --privileged \
            --shm-size=2g \
            kalilinux/kali-rolling:latest tail -f /dev/null

      - name: Install Kali Linux Desktop, Tools, XRDP & OpenSSH
        env:
          INSTALL_LARGE: ${{ github.event.inputs.install_large_tools }}
        run: |
          docker exec -e INSTALL_LARGE="$INSTALL_LARGE" -i kali bash << 'EOF'
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          
          # Core Kali Desktop (XFCE), RDP, SSH, and Default Kali tools
          apt-get install -y             kali-desktop-xfce             kali-linux-default             xorg             xrdp             dbus-x11             openssh-server             sudo             wget             curl             git             tmate             net-tools             nano             vim             unzip

          if [ "$INSTALL_LARGE" = "true" ]; then
            apt-get install -y kali-linux-large || true
          fi
          EOF

      - name: Install In-Built Google Chrome Browser
        run: |
          docker exec -i kali bash << 'EOF'
          export DEBIAN_FRONTEND=noninteractive
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
          apt-get install -y /tmp/chrome.deb || apt-get install -f -y
          rm -f /tmp/chrome.deb

          # Container & XRDP lo Chrome crash avvakunda --no-sandbox flag add chestunnam
          if [ -f /opt/google/chrome/google-chrome ]; then
            sed -i 's|exec -a "$0" "$HERE/chrome" "$@"|exec -a "$0" "$HERE/chrome" --no-sandbox --disable-dev-shm-usage "$@"|g' /opt/google/chrome/google-chrome
          fi
          EOF

      - name: Configure Kali User, RDP & Direct Termux SSH Key (Lightning.ai Style)
        env:
          INPUT_SSH_KEY: ${{ github.event.inputs.ssh_public_key }}
          SECRET_SSH_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          KALI_PASS=$(openssl rand -base64 12)
          echo "KALI_PASS=$KALI_PASS" >> $GITHUB_ENV
          USER_SSH_KEY="${INPUT_SSH_KEY:-$SECRET_SSH_KEY}"

          docker exec -e KALI_PASS="$KALI_PASS" -e USER_SSH_KEY="$USER_SSH_KEY" -i kali bash << 'EOF'
          # Create kali user & add to sudo
          id -u kali &>/dev/null || useradd -m -s /bin/bash kali
          echo "kali:${KALI_PASS}" | chpasswd
          echo "root:${KALI_PASS}" | chpasswd
          usermod -aG sudo kali
          echo "kali ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/kali
          chmod 0440 /etc/sudoers.d/kali

          # Configure XFCE session for XRDP
          echo "xfce4-session" > /home/kali/.xsession
          chown kali:kali /home/kali/.xsession
          chmod +x /home/kali/.xsession

          # Setup SSH Public Key for passwordless Termux login (like Lightning.ai)
          mkdir -p /home/kali/.ssh /root/.ssh
          if [ -n "$USER_SSH_KEY" ]; then
            echo "$USER_SSH_KEY" >> /home/kali/.ssh/authorized_keys
            echo "$USER_SSH_KEY" >> /root/.ssh/authorized_keys
          fi
          chmod 700 /home/kali/.ssh /root/.ssh
          chmod 600 /home/kali/.ssh/authorized_keys /root/.ssh/authorized_keys 2>/dev/null || true
          chown -R kali:kali /home/kali/.ssh

          # Configure OpenSSH Server on Port 22
          mkdir -p /run/sshd
          sed -i 's/#Port 22/Port 22/g' /etc/ssh/sshd_config
          sed -i 's/#PubkeyAuthentication yes/PubkeyAuthentication yes/g' /etc/ssh/sshd_config
          sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/g' /etc/ssh/sshd_config
          sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config
          sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/g' /etc/ssh/sshd_config

          # Start SSH and XRDP services inside Kali
          service ssh restart
          service dbus start || true
          service xrdp restart

          # Start tmate session as kali user for direct one-click Termux SSH
          su - kali -c "tmate -S /tmp/tmate.sock new-session -d"
          su - kali -c "tmate -S /tmp/tmate.sock wait tmate-ready"
          EOF

      - name: Maintain Connection & Show Termux SSH / RDP Details
        run: |
          TMATE_SSH=$(docker exec -i kali su - kali -c "tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'" || true)
          
          echo "=========================================================="
          echo "        KALI LINUX FULL + CHROME + TERMUX SSH READY       "
          echo "=========================================================="
          if [ -n "$TAILSCALE_IP" ]; then
            echo "1) Direct Termux SSH (Lightning.ai Style via Tailscale):"
            echo "   ssh kali@$TAILSCALE_IP"
            echo ""
            echo "2) Kali Full GUI Desktop (RDP with Google Chrome):"
            echo "   RDP Address : $TAILSCALE_IP:3389"
            echo "   Username    : kali"
            echo "   Password    : $KALI_PASS"
          fi
          echo ""
          echo "3) Direct Instant Termux SSH (No Tailscale Needed):"
          echo "   $TMATE_SSH"
          echo "=========================================================="

          while true; do
            echo "[$(date)] Kali Linux Active - Termux SSH & RDP running..."
            sleep 300
          done
