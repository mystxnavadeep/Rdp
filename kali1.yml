name: Kali1 Developer Studio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kali1:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install desktop, SSH and developer tools
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies dbus-x11 xrdp \
            openssh-server curl wget git unzip zip \
            python3 python3-pip python3-venv \
            nodejs npm \
            build-essential clang lldb lld llvm cmake ninja-build \
            pkg-config \
            openjdk-17-jdk openjdk-21-jdk \
            adb fastboot \
            chromium-browser \
            gh

          # Android command-line SDK
          mkdir -p "$HOME/Android/Sdk/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O android-tools.zip
          unzip -q android-tools.zip
          mkdir -p "$HOME/Android/Sdk/cmdline-tools/latest"
          mv cmdline-tools/* "$HOME/Android/Sdk/cmdline-tools/latest/"
          echo "ANDROID_HOME=$HOME/Android/Sdk" >> "$GITHUB_ENV"
          echo "$HOME/Android/Sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/Android/Sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | sdkmanager --sdk_root="$HOME/Android/Sdk" --licenses || true
          sdkmanager --sdk_root="$HOME/Android/Sdk" \
            "platform-tools" "platforms;android-35" \
            "build-tools;35.0.0" "cmdline-tools;latest"

          # Android Studio (GUI IDE)
          wget -q https://redirector.gvt1.com/edgedl/android/studio/ide-zips/latest/android-studio-linux.tar.gz -O /tmp/android-studio.tar.gz
          sudo tar -xzf /tmp/android-studio.tar.gz -C /opt
          sudo ln -sf /opt/android-studio/bin/studio /usr/local/bin/android-studio

          # VS Code desktop
          wget -q https://update.code.visualstudio.com/latest/linux-deb-x64/stable -O /tmp/code.deb
          sudo apt-get install -y /tmp/code.deb

          # OpenCode CLI
          curl -fsSL https://opencode.ai/install | bash

          # Claude CLI
          curl -fsSL https://claude.ai/install.sh | bash

          # Antigravity CLI (install if official installer is available)
          # Configure/authenticate interactively after SSH login.

      - name: Configure SSH key authentication
        shell: bash
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -eux
          test -n "$SSH_PUBLIC_KEY"
          sudo mkdir -p /home/runner/.ssh
          echo "$SSH_PUBLIC_KEY" | sudo tee /home/runner/.ssh/authorized_keys >/dev/null
          sudo chmod 700 /home/runner/.ssh
          sudo chmod 600 /home/runner/.ssh/authorized_keys
          sudo chown -R runner:runner /home/runner/.ssh

          sudo mkdir -p /run/sshd
          sudo sed -i \
            -e 's/^#\\?PubkeyAuthentication.*/PubkeyAuthentication yes/' \
            -e 's/^#\\?PasswordAuthentication.*/PasswordAuthentication no/' \
            /etc/ssh/sshd_config
          sudo systemctl restart ssh

      - name: Install and connect Tailscale
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -eux
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="kali1-${GITHUB_RUN_ID}"
          TS_IP="$(sudo tailscale ip -4 | head -n1)"
          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Keep Studio available
        shell: bash
        run: |
          echo "Kali1 Developer Studio SSH:"
          echo "Host: $TAILSCALE_IP"
          echo "User: runner"
          echo "Connect from Termux using your private key."
          while true; do
            echo "Kali1 active: $(date)"
            sleep 300
          done
